<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ateliê Betha</title>
</head>
<body>
      <header class="cabecalho">
        <div class="caixa-topo">
            
            <div class="logo">
                <span>Ateliê Betha</span>
            </div>

            <nav class="menu">
                <a href="#inicio">Início</a>
                <a href="#catalogo">Produtos</a>
                <a href="#equipe">Equipe</a>
            </nav>
        </div>
    </header>

    <!-- Catalogo -->

    <main id="catalogo" class="catalogo">
        <h2 class="titulo-secao">Nossos Produtos</h2>

        <div id="grade-produtos" class="grade-produtos">
        </div>
    </main>

    <!-- Equipe -->

    <section id="equipe" class="secao-equipe">
        <h2 class="titulo-secao">Criadoras do Ateliê</h2>
        
        <div class="caixa-equipe">
            <div class="cartao-membro">
                <div class="avatarA">A</div>
                <div class="texto-membro">
                    <p class="nome-membro">Ágatha</p>
                    <p class="cargo-membro">Dev Header & Setup</p>
                </div>
            </div>

            <div class="cartao-membro">
                <div class="avatarB">B</div>
                <div class="texto-membro">
                    <p class="nome-membro">Beatriz</p>
                    <p class="cargo-membro">Dev Catálogo & Banner</p>
                </div>
            </div>
        </div>
    </section>

     <footer class="rodape">
        <p>Ateliê Betha - 2026 - Trabalho Prático de Git & GitHub</p>
    </footer>

 <script>
        const listaProdutos = [
            { id: 1, nome: "Tapete Flor de Crochê", preco: "R$ 89,90", img: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=400&q=80" },
            { id: 2, nome: "Bolsa Fio de Malha", preco: "R$ 15git add .0,00", img: "https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=400&q=80" },
            { id: 3, nome: "Amigurumi Ursinho", preco: "R$ 65,00", img: "https://images.unsplash.com/photo-1558060370-d644479be6f7?auto=format&fit=crop&w=400&q=80" }
        ];

        function carregarProdutos() {
            const container = document.getElementById('grade-produtos');
            container.innerHTML = listaProdutos.map(p => `
                <div class="cartao-produto">
                    <img src="${p.img}" alt="${p.nome}" class="imagem-produto">
                    <h3 class="titulo-produto">${p.nome}</h3>
                    <p class="preco-produto">${p.preco}</p>
                    <button class="botao-rosa">Encomendar</button>
                </div>
            `).join('');
        }
        window.onload = carregarProdutos;
    </script>



    
</body>
</html>
